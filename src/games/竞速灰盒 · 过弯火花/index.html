function drawForbidZone(){
  const x0=W*CFG.Forbid.x0, x1=W*CFG.Forbid.x1, y0=H*CFG.Forbid.y0, y1=H*CFG.Forbid.y1;
  ctx.save(); ctx.setLineDash && ctx.setLineDash([6,5]);
  ctx.strokeStyle='rgba(255,212,0,0.55)'; ctx.lineWidth=1;
  ctx.strokeRect(x0,y0,x1-x0,y1-y0); ctx.restore();
  ctx.fillStyle='rgba(255,212,0,0.7)'; ctx.font='10px Consolas,monospace'; ctx.textAlign='left';
  ctx.fillText('中心禁区（仅调试显示，UI 不得放置）', x0+4, y0+12);
}

/* ---- HUD：全部排在中心禁区之外 ----
   左上（x<22%, y<29%）：计时 / 阶段 / 威胁提示
   右上（x>78%）：小地图 + 名次列（永不隐藏）
   左下（y>71%）：自己的速度 / 血量 / 技能 / 道具 / 补偿
   上方横条（y<29%）：R-29 横幅 / R-30 归因一行 / 终局提示
*/
function drawHUD(){
  const p=cars[state.playerIdx];
  const rem=Math.max(0,CFG.MatchSeconds-state.elapsed);
  const mm=Math.floor(rem/60), ss=Math.floor(rem%60);
  /* ---- 左上 ---- */
  ctx.textAlign='left';
  ctx.fillStyle='rgba(10,13,17,0.72)'; ctx.fillRect(10,10,244,92);
  ctx.strokeStyle='#2C343E'; ctx.lineWidth=1; ctx.strokeRect(10,10,244,92);
  /* L1：当前用时 / 剩余时间（同一数字区，不新增面板） */
  const curM=Math.floor(state.elapsed/60), curS=Math.floor(state.elapsed%60);
  ctx.fillStyle='#E8EEF5'; ctx.font='bold 19px Consolas,monospace';
  ctx.fillText(curM+':'+String(curS).padStart(2,'0')+' / '+mm+':'+String(ss).padStart(2,'0'), 20, 36);
  ctx.font='11px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#94A2B2';
  ctx.fillText('赛程 '+(state.raceProgress*100).toFixed(1)+'%  ·  '+p.s.toFixed(0)+'/'+CFG.TrackLength+'m', 20, 54);
  /* L2：最佳完赛成绩（新增显示位，左标签 + 右数值；无纪录显示 —，不隐藏整行） */
  const best=state.best;
  const bestTxt = best ? (best.finishTime>=0 ? best.finishTime.toFixed(1)+'s' : best.maxS.toFixed(0)+'m') : '—';
  ctx.fillText('最佳完赛成绩', 20, 70);
  ctx.fillStyle=state.newBest?'#F2F5F8':'#94A2B2';
  ctx.textAlign='right'; ctx.font='12px Consolas,monospace';
  ctx.fillText(bestTxt, 244, 70); ctx.textAlign='left';
  ctx.font='11px "Microsoft YaHei",sans-serif';
  ctx.fillStyle=state.finalPhase?CFG.Accent:'#7E8B9A';
  ctx.fillText((state.finalPhase?'终局 20s：禁攻击 / 加速带开放':'规则正常 · 攻击可用')+'　'+state.timeScale+'x', 20, 86);

  /* ---- 右上：小地图 + 名次列 ---- */
  const mx=W-236, mw=224;
  ctx.fillStyle='rgba(10,13,17,0.78)'; ctx.fillRect(mx,10,mw,64);
  ctx.strokeStyle='#2C343E'; ctx.strokeRect(mx,10,mw,64);
  ctx.fillStyle='#94A2B2'; ctx.font='10px "Microsoft YaHei",sans-serif';
  ctx.fillText('全图 0 —— '+CFG.TrackLength+'m', mx+8, 24);
  const barX=mx+10, barW=mw-20, barY=40;
  ctx.fillStyle='#2A323B'; ctx.fillRect(barX,barY,barW,10);
  /* 分叉区中性刻度（同亮度，不暗示哪条更快） */
  ctx.fillStyle='#3B4550';
  ctx.fillRect(barX+barW*FORK_B/CFG.TrackLength,barY-3,barW*CFG.ForkSpan/CFG.TrackLength,16);
  /* 海路段：水面色带，明确「海路 ≠ 陆路」 */
  ctx.fillStyle=CFG.SeaFill;
  ctx.fillRect(barX+barW*CFG.SeaStart/CFG.TrackLength,barY-3,barW*(CFG.SeaEnd-CFG.SeaStart)/CFG.TrackLength,16);
  for(let i=0;i<cars.length;i++){
    const c=cars[i];
    if(c.underwater){
      /* DEV-1：水下潜艇不给实时点，只给 2.0s 衰减尾迹 */
      for(let q=0;q<c.trail.length;q++){
        const age=state.elapsed-c.trail[q].t;
        const a=clamp(1-age/CFG.SubTrailSeconds,0,1)*0.8;
        ctx.fillStyle=rgba('#9FB6C9',a);
        ctx.fillRect(barX+barW*clamp(c.trail[q].s/CFG.TrackLength,0,1)-1,barY+3,2,4);
      }
      continue;
    }
    const x=barX+barW*clamp(c.s/CFG.TrackLength,0,1);
    ctx.fillStyle=c.cls.color;
    const r=c.isPlayer?5:3;
    ctx.beginPath(); ctx.arc(x,barY+5,r,0,Math.PI*2); ctx.fill();
    if(c.isPlayer){ ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,barY+5,7,0,Math.PI*2); ctx.stroke(); }
    /* R-32 小地图皇冠（≥65% 头名标记） */
    if(state.huntStage>0 && c===state.leader){
      ctx.fillStyle=state.huntStage>=2?'#FF6B60':'#E6EDF4'; ctx.font='11px Consolas,monospace';
      ctx.textAlign='center'; ctx.fillText('♛',x,barY-6); ctx.textAlign='left';
    }
  }
  /* 名次列：剪影 + 名次 + ±m，永不隐藏（R-20 / R-09） */
  const ry=84;
  /* 表头行高 20→40：L1854 fillRect 与 L1855 strokeRect 两处高度必须同步，否则框会切掉最后一行 */
  ctx.fillStyle='rgba(10,13,17,0.78)'; ctx.fillRect(mx,ry,mw,40+cars.length*20);
  ctx.strokeStyle='#2C343E'; ctx.strokeRect(mx,ry,mw,40+cars.length*20);
  ctx.fillStyle='#94A2B2'; ctx.font='10px "Microsoft YaHei",sans-serif';
  ctx.fillText('名次　载具　±m', mx+8, ry+13);
  /* L1 主名次大字：由既有 P1..P4 小字放大重排，零新数据源 */
  ctx.fillStyle='#F2F5F8'; ctx.font='bold 24px Consolas,monospace';
  ctx.fillText('P'+p.rank+' / '+cars.length, mx+8, ry+35);
  for(let i=0;i<state.order.length;i++){
    const c=state.order[i], y=ry+52+i*20;
    ctx.fillStyle=c.cls.color; ctx.fillRect(mx+8,y-9,11,11);           // 剪影
    ctx.fillStyle=c.isPlayer?'#FFFFFF':'#B7C2CE'; ctx.font='11px Consolas,monospace';
    ctx.fillText(String(c.rank), mx+26, y);
    ctx.fillText(c.cls.name+(c.isPlayer?'(你)':''), mx+44, y);
    const dm=c.s-p.s;
    ctx.fillStyle=c===p?CFG.Accent:'#8B98A8';
    ctx.font='12px Consolas,monospace'; ctx.textAlign='right';
    ctx.fillText(fmt(dm,0)+'m', mx+mw-8, y); ctx.textAlign='left';
  }

  /* ---- 左下：自己状态 ---- */
  const by=H-(document.getElementById('debug').classList.contains('on')?196:0)-134;
  ctx.fillStyle='rgba(10,13,17,0.78)'; ctx.fillRect(10,by,268,124);
  ctx.strokeStyle='#2C343E'; ctx.strokeRect(10,by,268,124);
  ctx.fillStyle=p.cls.color; ctx.font='bold 13px "Microsoft YaHei",sans-serif';
  ctx.fillText(p.cls.name+' · '+p.name + (isSea(p.s)?'　🌊海域':'　🛣陆路'), 20, by+20);
  /* 血条 */
  ctx.fillStyle='#2A323B'; ctx.fillRect(20,by+28,180,9);
  ctx.fillStyle=p.hp<CFG.LowHpFrac*p.cls.hp?'#E04B4B':'#7FB069';
  ctx.fillRect(20,by+28,180*clamp(p.hp/p.cls.hp,0,1),9);
  ctx.fillStyle='#C9D3DE'; ctx.font='11px Consolas,monospace';
  ctx.fillText('hp '+p.hp.toFixed(0)+'/'+p.cls.hp, 206, by+37);
  ctx.font='11px "Microsoft YaHei",sans-serif'; ctx.fillStyle='#AEB8C4';
  const cd=Math.max(0,p.cdUntil-state.elapsed);
  ctx.fillText('Q '+p.cls.active+'　'+(cd>0?('CD '+cd.toFixed(1)+'s'):'就绪'), 20, by+56);
  ctx.fillText('道具 '+(p.held>0?'持有 1（左键/空格发射）':'空')+'　·　任意方向', 20, by+72);
  /* R-33：补偿百分比只对获得者显示；领先者只读「有人在追」，无数字 */
  if(p.isLag && p.bCatchup>0.0001){
    ctx.fillStyle=CFG.Accent;
    ctx.fillText('追赶补偿 +'+(p.bCatchup*100).toFixed(1)+'%', 20, by+90);
  } else if(p.rank===1){
    const chasing=cars.some(function(c){ return c!==p && c.bCatchup>0.0001; });
    ctx.fillStyle=chasing?'#8B98A8':'#5F6B78';
    ctx.fillText(chasing?'有人在追':'·', 20, by+90);
  } else {
    ctx.fillStyle='#5F6B78'; ctx.fillText('·', 20, by+90);
  }
  if(p.grind){ ctx.fillStyle='#FFE9A8'; ctx.textAlign='right'; ctx.fillText('磨墙 · 掉速', 268, by+90); ctx.textAlign='left'; }
  if(p.squeeze){ ctx.fillStyle='#C9D3DE'; ctx.textAlign='right'; ctx.fillText('被挤压', 268, by+72); ctx.textAlign='left'; }
  if(p.underwater){ ctx.fillStyle='#9FB6C9'; ctx.textAlign='right'; ctx.fillText('水下隐身', 268, by+56); ctx.textAlign='left'; }

  /* 与幽灵车实时秒差：时间轴口径，四处同源同值；不靠颜色编码，用 ↑/↓ + +/− 冗余表达 */
  if(state.best && state.best.samples && state.best.samples.length){
    const gd = ghostDeltaSeconds(state.best.samples, p.s, state.elapsed);
    if(gd!==null){
      ctx.fillStyle='#94A2B2'; ctx.font='12px "Microsoft YaHei",sans-serif'; ctx.textAlign='left';
      ctx.fillText('与最佳', 20, by+108);
      ctx.fillStyle='#F2F5F8'; ctx.font='12px Consolas,monospace';
      ctx.textAlign='right'; ctx.fillText((gd<=0?'↑ ':'↓ ')+fmt(gd,1)+'s', 268, by+108); ctx.textAlign='left';
    }
  }

  /* 操作提示（左下角，禁区外） */
  ctx.fillStyle='rgba(140,152,166,0.65)'; ctx.font='10px "Microsoft YaHei",sans-serif';
  ctx.fillText('↑油门 ↓刹车 ←→转向 · 急弯：全速必蹭墙，松油门或朝弯心打方向 · 鼠标发射 · Q技能 · P暂停 · D调试 · H说明', 10, H-6-(document.getElementById('debug').classList.contains('on')?196:0));

  /* 示范模式顶栏字幕（零外部依赖，脚本化循环演示） */
  if(state.demo){
    ctx.fillStyle='rgba(255,212,0,0.95)'; ctx.font='bold 13px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
    ctx.fillText('示范（自动循环）：① 全速冲急弯、不转向 → 被甩向外侧护栏、蹭墙掉速（看火花）　② 进弯前松油门 + 朝弯心打方向 → 干净通过　· 按任意键退出', W/2, 22);
    ctx.textAlign='left';
  }
}

function showStart(){
  /* 回到开局面板：清掉上一局的终局/暂停态，避免 Enter 无法开局 */
  state.started=false; state.finished=false; state.paused=false;
  state.helpOpen=false; state.resultShown=false; state.demo=false;
  cars=[]; projectiles=[]; sparks=[];
  const el=document.getElementById('panel');
  let cards='';
  for(let i=0;i<CFG.Classes.length;i++){
    const c=CFG.Classes[i];
    cards += '<div class="card'+(i===0?' sel':'')+'" data-i="'+i+'">'+
      '<div class="nm"><span class="sw" style="background:'+c.color+'"></span>'+c.name+'</div>'+
      '<div class="li">hp '+c.hp+'　v1 '+c.v1.toFixed(1)+' m/s</div>'+
      '<div class="li">主动：'+c.active+'</div>'+
      '<div class="li">被动：'+c.passive+'</div></div>';
  }
  el.innerHTML =
    '<h1>竞速灰盒垂直切片 · 过弯火花</h1>'+
    '<p>单文件 / 零依赖 / <span class="tag">双击 index.html 即可玩</span>。目标：验证「这局竞速有没有竞争欲望」。这是 Phase 4 预制作灰盒，不是最终产品。</p>'+
    '<h2>选择载具（1–4 或点击，四台载具全部上场，你选 1 台、AI 3 台）</h2>'+
    '<div class="cards" id="cards">'+cards+'</div>'+
    '<button class="btn" id="btnStart">开始比赛　(Enter / 空格)</button>'+
    '<button class="btn ghost" id="btnDemo" style="margin-left:8px">看示范（自动循环）</button>'+
    '<button class="btn ghost" id="btnHelp" style="margin-left:8px">操作与规则说明 (H)</button>'+
    '<button class="btn ghost" id="btnAudioStart" style="margin-left:8px">音效：'+(state.audioOn?'开':'关')+'</button>'+
    '<div id="helpBox" style="display:none">'+helpHTML()+'</div>';
  document.getElementById('overlay').classList.remove('off');
  const cardsEl=document.getElementById('cards');
  cardsEl.addEventListener('click',function(e){
    const card=e.target.closest ? e.target.closest('.card') : null;
    if(!card) return;
    const all=cardsEl.querySelectorAll('.card');
    for(let i=0;i<all.length;i++) all[i].classList.remove('sel');
    card.classList.add('sel');
    state.selClass=parseInt(card.getAttribute('data-i'),10);
  });
  if(!state) { /* 首次：建立最小 state 以承载选择 */ }
  state.selClass = 0;
  document.getElementById('btnStart').addEventListener('click',function(){ newMatch(state.selClass||0); unlockAudio(); });
  document.getElementById('btnAudioStart').addEventListener('click',function(){
    state.audioOn=!state.audioOn;
    if(state.audioOn){ state.audioUnlocked=true; ensureAudio(); }   // 覆盖「关掉再打开」的缓存短路
    this.textContent='音效：'+(state.audioOn?'开':'关');
  });
  document.getElementById('btnHelp').addEventListener('click',function(){
    const b=document.getElementById('helpBox');
    b.style.display = b.style.display==='none'?'block':'none';
  });
  document.getElementById('btnDemo').addEventListener('click',function(){ startDemo(); });
}
function helpHTML(){
  return '<h2>操作</h2>'+
    '<p>方向键 / WASD 驾驶（↑＝油门、↓＝刹车、←→＝转向）；鼠标瞄准 + 左键 / 空格发射道具（任意方向）；<b>Q</b> 主动技能；<b>1–4</b> 或开局界面选载具；<b>P</b> 暂停；<b>D</b> 调试面板；<b>H</b> 本说明。调试面板提供 0.5x / 1x / 2x / 4x 时间倍率与「跳到最后 30 秒」。<br><span style="color:#8B98A8">注：规格同时要求「WASD 的 D 右转」与「D 开调试面板」，本切片一字两用：<b>单击 D</b> 切换调试面板，<b>按住 D</b> 仍作右转；也可用 ←/→ 方向键转向，完全避开重叠。</span></p>'+
    '<h2>过弯磨墙火花 —— 本轮新增的硬需求，三条硬约束</h2>'+
    '<div class="rules"><ol>'+
    '<li><b>磨墙不产生 <code>on_hit</code>、不进 <code>hit_log</code>、不扣血，掉速是唯一代价。</b><br>理由：持续接触若每帧触发命中事件，会污染「受害者键聚合」的 6s 递减窗口 —— 环境伤害把窗口吃满后，真正的集火反而按 50% 结算却没人集火，集火防线（R3）被环境噪声废掉。P2「每条路都付代价」由掉速承担，不用扣血。<br><span class="tag">调试面板「磨墙自证」实时显示 Δhp / Δlog，应为 0 / 0。</span></li>'+
    '<li><b>与「车-车挤压」的反馈严格分离。</b><br>车-墙摩擦 ＝ 方向性火花（向后拖尾）+ 掉速；车-车挤压 ＝ 车体侧倾 + 连续震频。<b>不许共用同一套粒子 / 音效通道</b>，否则玩家分不清「我被挤了」还是「我蹭墙了」。这是两条正确规则在交互处叠加，必须拆开定责。持续接触态带 <code>contact_target ∈ {Wall, Vehicle, Prop}</code> 用来拆开定责：火花只读 Wall。<br><span class="tag">灰盒切片：挤压暂为零粒子（侧倾 + 震频），第三项粒子通道待 Unity 补回，见 art-bible 附录 C.8；「不许共用」≠「不许有」，R-26 是 L+ 正式机制。</span></li>'+
    '<li><b>封顶饱和（PR-2：表演可以撒谎，但必须留字据）。</b><br>发射率每车 18/s、全场 72/s；<b>0.20s 建立期</b>由「持续接触态已持续时间」驱动，E(t)=18×min(1,t_c/0.20)，之后恒 18/s —— <b>完全不读摩擦深度、不读车速</b>。超过 0.20s 后唯一继续变化的量是「火花发射总时长」；强度 / 密度 / 亮度 / 色相 / 单粒子参数全部冻结。字据：忠实映射会把「蹭得更狠」如实翻译成「火花更猛」，把注意力从驾驶拉到特效、暴露未标定的接触深度，还会把「代价」演成「奖励」（触碰 PR-1）。渐进起手 0.20s 是「持续磨墙 ≠ 撞墙爆炸」的第一道保险。火花单色恒定 #FFF3D6、无光晕无屏闪、不落到 UI 独占色 #FFD400。</li>'+
    '</ol></div>'+
    '<h2>怎么试出火花 / 怎么避免一直磨墙</h2>'+
    '<p>赛道有缓弯 / 中弯 / 急弯（世界层有小标签）。<b>全速且「不转向」地冲进急弯，必被甩向外侧护栏、蹭墙出火花并掉速</b>；<b>只要朝弯心打方向（←/→ 或 A/D 转向），就能把车拉回线内、干净通过</b>；也可进弯前松油门或点刹车把速度降到约 13 m/s 以下兜底。转向权限已还给玩家——转对方向是关键，不转向或转反方向都会一直贴外侧护栏。AI 同样适用：AI 过弯也会 understeer、也必须出火花，<b>没有 AI 免疫</b>。不确定手感？开局界面点「<b>看示范（自动循环）</b>」看一遍脚本化演示。</p>'+
    '<h2>规则速览</h2>'+
    '<p>单局 220s / 4200m 换算；四车共用一套基础物理，只调 m_class 与技能。速度修饰栈四层（冲刺挂 ① 层，不解除 cap）。伤害按受害者键聚合：6s 窗口内第 2 击 70%、第 3 击起 50%，归零后 3s 免疫；归零不淘汰，cap 55% / 5s / 掉进度 10m，重复归零递减 5.0/55%/10m → 3.5/70%/6m → 2.5/80%/4m。恰好 1 种攻击道具（45 伤害，派发即入栏，持有上限 1，后 50% 派发权重 ×1.5 只改变归谁、不改变全场总量）。补偿按与前车时间差线性给、上限 +5%，差 &lt;0.5s 归零，<b>百分比只对获得者显示</b>。<b>最后 20s 四件事同刻</b>：禁攻击 + 派发停止 + 加速带开放 + 持有道具自动兑换加速。</p>'+
    '<p>中段分叉三条路：<b>平均亮度对齐</b>，窄路只用碎石 / 障碍剪影表现「更危险」，不给金色 / 光柱 / 箭头 / 亮度差 / 「更快」字样（PR-1、R-03）。窄近路 4m 走廊强制互穿容差 0.50，走廊内不许完成超车。<b>后段有一条约 550m 的共享海域（赛道带变蓝、标「海域 SEA」）</b>：陆上车（大运 / 飞机 / 赛车）泡水里被拖慢（v1×0.80），<b>只有潜艇在水里加速（v1×1.15）且能按 Q 下潜隐身</b>——这是潜艇唯一的专属优势，选潜艇过海路能拉开身位。</p>'+
    '<p style="color:#7E8B9A">顶部 CFG 集中所有可调参数，每项标注 [锁定] / [推算] / [推断]。大量数值是占位推断值，待手感 / 美术回填。</p>';
}
function showHelpInGame(){
  const el=document.getElementById('panel');
  el.innerHTML='<h1>操作与规则说明</h1><div>'+helpHTML()+'</div>'+
    '<button class="btn" id="btnCloseHelp">返回比赛 (H / Esc)</button>';
  document.getElementById('overlay').classList.remove('off');
  state.paused=true; state.helpOpen=true;
  document.getElementById('btnCloseHelp').addEventListener('click',closeHelp);
}
function closeHelp(){
  document.getElementById('overlay').classList.add('off');
  state.helpOpen=false; if(!state.finished) state.paused=false;
}
function hideOverlay(){ document.getElementById('overlay').classList.add('off'); }
function buildResultIfNeeded(reset){ if(reset) state.resultShown=false; }
function showResult(){
  if(state.resultShown) return;
  state.resultShown=true;
  const p=cars[state.playerIdx];
  /* 本局成绩：全项目唯一存档写入点。只在成绩更好且轨迹可回放时覆盖历史最佳。 */
  const cur={
    version:1,
    finishTime:(p && p.finished && p.finishTime>=0) ? p.finishTime : -1,
    maxS:Math.max(state.maxPlayerS||0, p?p.s:0),
    samples:state.ghostSamples.slice()
  };
  const prev=state.best;
  state.newBest = (cur.samples.length>=2) && betterThan(cur, prev);
  if(state.newBest){ state.best=cur; saveBest(cur); }
  const grade = (p.rank===1 && state.newBest) ? 'S' :
                ((p.rank===1 || (p.rank===2 && state.newBest)) ? 'A' : 'B');
  const bestTxt = state.best
    ? (state.best.finishTime>=0 ? state.best.finishTime.toFixed(1)+'s' : state.best.maxS.toFixed(0)+'m')
    : '—';
  let ghostTxt = '';
  if(prev && prev.samples && prev.samples.length>=2){
    const gd = ghostDeltaSeconds(prev.samples, p.s, state.elapsed);
    if(gd!==null) ghostTxt='<p>与最佳　'+(gd<=0?'↑ 快 ':'↓ 慢 ')+Math.abs(gd).toFixed(1)+'s</p>';
  }
  const el=document.getElementById('panel');
  let rows='';
  for(let i=0;i<state.order.length;i++){
    const c=state.order[i];
    rows += '<p><span style="color:'+c.cls.color+'">■</span> 第 '+c.rank+' 名　'+c.cls.name+' · '+c.name+
            '　进度 '+(c.s/CFG.TrackLength*100).toFixed(1)+'%　归零 '+c.zeroCount+' 次'+
            (c.finished?('　完赛 '+c.finishTime.toFixed(1)+'s'):'')+'</p>';
  }
  el.innerHTML='<h1>本局结束 · 220s</h1>'+rows+
    '<h2>本局成绩　评级 '+grade+'</h2>'+
    '<p>你的名次　第 '+p.rank+' 名　·　进度 '+p.s.toFixed(0)+'/'+CFG.TrackLength+'m　·　'+
    (p.finished && p.finishTime>=0 ? '完赛用时 '+p.finishTime.toFixed(1)+'s' : '本局用时 '+state.elapsed.toFixed(1)+'s')+'</p>'+
    '<p>最佳完赛成绩　'+bestTxt+(state.newBest?'　★ 新纪录':'')+'</p>'+ghostTxt+
    '<p style="color:#8B98A8">'+(state.newBest
      ? '下一局会有半透明紫色的「自己」陪跑，HUD 实时显示与最佳的时间差。'
      : '按 s 排序（4200m 换算口径）。归零不淘汰，四车全程未卡死。')+'</p>'+
    '<button class="btn" id="btnRestart">再来一局 (R)</button>';
  document.getElementById('overlay').classList.remove('off');
  document.getElementById('btnRestart').addEventListener('click',function(){ showStart(); });
}

/* =====================================================================
   输入
   ===================================================================== */
window.addEventListener('keydown',function(e){
  const code=e.code||'';
  state.keys[code]=true;
  if(state.demo){ exitDemo(); return; }   // 示范模式：任意键退出
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(code)>=0) e.preventDefault && e.preventDefault();
  if(e.repeat) return;
  if(code==='KeyP' && !state.helpOpen && state.started) state.paused=!state.paused;
  if(code==='KeyD'){ toggleDebug(); }
  /* 开局面板上 H/Esc 只展开内嵌说明，不切走选车界面 */
  if(code==='KeyH' || code==='Escape'){
    if(!state.started){ const b=document.getElementById('helpBox'); if(b) b.style.display = b.style.display==='none'?'block':'none'; }
    else if(state.helpOpen) closeHelp();
    else showHelpInGame();
  }
  if(code==='KeyR' && state.finished) showStart();
  if(code==='KeyQ' && state.started && !state.paused && !state.finished && !state.helpOpen) useActive(cars[state.playerIdx], state.elapsed);
  if(code==='Space' && !state.started && !state.helpOpen &&
     !document.getElementById('overlay').classList.contains('off')){
    newMatch(state.selClass||0); unlockAudio();   // 开局面板：空格与 Enter 同义（按钮标签所写）
    return;
  }
  if(code==='Space' && state.started && !state.paused && !state.finished && !state.helpOpen &&
     document.getElementById('overlay').classList.contains('off')){
    const p=cars[state.playerIdx], ps=screenOf(p.s,p.d);
    const ang=Math.atan2(state.mouse.y-ps.y, state.mouse.x-ps.x);
    fire(p,ang);
  }
  if(/^Digit[1-4]$/.test(code) && !state.finished){
    /* 1–4 选载具：仅在开局面板可见时生效，避免局中误触 */
    if(!document.getElementById('overlay').classList.contains('off')){
      const all=document.querySelectorAll('#cards .card');
      const i=parseInt(code.slice(5),10)-1;
      for(let k=0;k<all.length;k++) all[k].classList.remove('sel');
      if(all[i]) all[i].classList.add('sel');
      state.selClass=i;
    }
  }
  if(code==='Enter' && !document.getElementById('overlay').classList.contains('off') && !state.helpOpen && !state.finished){
    newMatch(state.selClass||0); unlockAudio();
  }
});
window.addEventListener('keyup',function(e){ state.keys[e.code||'']=false; });
cv.addEventListener('mousemove',function(e){
  state.mouse.x=e.clientX; state.mouse.y=e.clientY;
});
cv.addEventListener('mousedown',function(e){
  if(state.demo){ exitDemo(); return; }   // 示范模式：点击退出
  if(e.button!==0 || !state.started || state.paused || state.finished || state.helpOpen) return;
  if(!document.getElementById('overlay').classList.contains('off')) return;
  const p=cars[state.playerIdx], ps=screenOf(p.s,p.d);
  const ang=Math.atan2(state.mouse.y-ps.y, state.mouse.x-ps.x);
  fire(p,ang);
});

function forceZero(c){
  c.hp=0; applyZero(c, cars[(c.idx+1)%cars.length], state.elapsed);
  dbg.forcedZeroCount++;
}

/* 「跳到最后 30 秒」：真实快进模拟（不瞬移、不破坏物理状态），保持四车状态自洽 */
function skipTo(target){
  if(!state || !state.started || target<=state.elapsed) return;
  const wasPaused=state.paused; state.paused=false;
  state.slowRemain=0; state.camPush=0;   // 快进不带着 R-30 慢放走
  const FIXED=1/60;
  let guard=0;
  while(state.elapsed<target && guard<20000){ step(FIXED); guard++; }
  state.paused=wasPaused;
  buildDebugButtons();
}

/* =====================================================================
   主循环（fixed timestep accumulator）
   ===================================================================== */
let acc=0, lastT=0, fpsAcc=0, fpsCnt=0;
function loop(t){
  if(!lastT) lastT=t;
  let raw=(t-lastT)/1000; lastT=t;
  if(raw>0.05) raw=0.05;
  fpsAcc+=raw; fpsCnt++;
  if(fpsAcc>=0.5){ dbg.fps=fpsCnt/fpsAcc; fpsAcc=0; fpsCnt=0; }
  /* R-30：0.15s 现实时间，按真实 dt 递减，与模拟时间缩放解耦 */
  if(state.slowRemain>0) state.slowRemain = Math.max(0, state.slowRemain - raw);
  if(!state.helpOpen){
    /* R-30 慢放：只压缩「模拟时间」，按现实时间 ≤0.15s 退出 */
    const scale = state.timeScale * (state.slowRemain>0 ? CFG.ZeroSlowScale : 1);
    acc += raw*scale;
    const FIXED=1/60;
    let n=0;
    while(acc>=FIXED && n<12){ step(FIXED); acc-=FIXED; n++; }
    if(n>=12) acc=0;
  }
  draw();
  if(document.getElementById('debug').classList.contains('on')) updateDebugReadout();
  requestAnimationFrame(loop);
}
